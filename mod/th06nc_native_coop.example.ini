; Copy next to th06nc.exe as th06nc_native_coop.ini. Every key is optional.
; Most of these can also be changed in the game: F8 in the menus opens the
; co-op settings panel, which saves back to this file.

[player2]
; Local (same-machine) second player. Ignored while connected online --
; then the partner is always Player 2.
; 0 = no second player
enabled=1
; P2 spawns this many game units to the right of P1 at stage start
spawn_offset_x=48
; P2's character: same, reimu_a, reimu_b, marisa_a, marisa_b. (Online, each
; player just picks their own in the game's menu instead.)
character=same

; Second player's controller: XInput index 0-3, or -1 for keyboard only.
; Index 1 = the second connected controller (the game itself reads index 0
; for Player 1).
pad_index=1

; Keyboard fallback for Player 2, as Windows virtual-key codes (letters are
; their ASCII codes: A=65 ... Z=90). Defaults: T/F/G/H move, O shoot,
; P bomb, I focus. The game itself also reads W/A/S/D, J/K/L, Q, R and the
; numpad for Player 1, so don't use those.
key_up=84
key_down=71
key_left=70
key_right=72
key_shoot=79
key_bomb=80
key_focus=73

[coop]
; Online, the host's values are used by both players.
; Boss HP is multiplied by this while two players are in the stage
boss_hp_multiplier=2.0
; 1 = practice: bullets, lasers and enemies can't kill anyone
invincible=0
; Who aimed enemy shots go after: nearest (the nearer living player),
; host (always Player 1), alternate (every other enemy aims at Player 2)
targeting=nearest
; 1 = one lives/bombs/power pool for both players (the game's own HUD);
; 0 = each player has their own (P2's shown in the status text, top left)
shared_resources=1
; Separate resources only: a player who runs out of lives is downed, and
; comes back with one life after this many seconds while the partner
; survives. 0 = stays down until a continue. Both down = game over.
revive_seconds=30
; Starting stock for a new run, per player, counted like the HUD (lives
; 1-9, bombs 0-9). -1 = the game's own option. With shared_resources=1 only
; P1's values apply (to the shared pool). A continue refills to these too.
p1_start_lives=-1
p1_start_bombs=-1
p2_start_lives=-1
p2_start_bombs=-1
; Power (0-128) both players start a run with; -1 = the game's (0)
start_power=-1
; Checkpoint: a new co-op run started from the menu (not practice, not a
; replay) begins at this stage, 1-6
start_stage=1
; Where in that stage: stage (its beginning), midboss (the timeline record
; that spawns the midboss), boss (the boss section). Untested (docs/12).
start_point=stage

[netplay]
; Online co-op through a Steam lobby: F9 = create a lobby and invite a
; friend, F10 = leave. The lobby owner is Player 1.
; rollback = responsive, re-simulates on late input; lockstep = waits for
; the partner's input every frame (simpler, needs low ping)
mode=rollback
; Frames between pressing a button and it taking effect (0-10)
input_delay=2
; Frames the game may simulate ahead on predicted input (1-15)
max_rollback=8

[synctest]
; Single-machine rollback self-test: 1 = at every stage start, keep rolling
; back and re-simulating to check snapshots are complete. Only while not
; connected online.
enabled=0
distance=4
interval=10

[visual]
; Cosmetic only; each player sets their own (docs/07).
; Your player's tint, RRGGBB (P1's in same-machine play). Online the
; partner sees you in this color.
color=FFFFFF
; Same-machine play: P2's tint
p2_color=A0C8FF
; The other player and their shots fade (to 15%) when within ~100 units
; of you
proximity_fade=1
; Ring + hitbox on the other player while they hold focus (the game shows
; no hitbox itself)
focus_ring=1
